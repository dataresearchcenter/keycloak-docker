name: Build docker container

on:
  workflow_dispatch: {}
  push: {}

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine Keycloak version
        id: keycloak_version
        run: |
          mapfile -t tags < <(sed -n 's|^FROM quay.io/keycloak/keycloak:\([^ @]*\).*|\1|p' Dockerfile)
          if [ "${#tags[@]}" -ne 2 ] || [ "${tags[0]}" != "${tags[1]}" ]; then
            echo "::error::the Dockerfile's FROM tags disagree: ${tags[*]}"
            exit 1
          fi
          echo "version=${tags[0]}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dataresearchcenter/keycloak
          tags: |
            type=raw,value=${{ steps.keycloak_version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release
        uses: docker/build-push-action@v7
        with:
          context: .
          # platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
